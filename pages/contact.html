<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuimiBurgers | Contacto</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html" alt="Ir al Inicio">Inicio</a></li>
                <li><a href="./menu.html" alt="Ir al Menú">Menú</a></li>
                <li><a href="./about-us.html" alt="Ir a Sobre Nosotros">Sobre Nosotros</a></li>
                <li><a href="#" alt="Ir a Contacto">Contacto</a></li>
                <li><a href="./prices.html" alt="Ir a Precios">Precios</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Contactanos!</h1>
            <h2>Tu retroalimentación nos ayuda a crecer y mejorar nuestros servicios.</h2>
            <form>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Ej: quimiburgers@gmail.com" required>

                <label for="telefono">Teléfono de contacto</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 1123456789" required>

                <label for="comentario">Comentario</label>
                <input type="text-area" id="comentario" name="comentario" placeholder="Tu comentario" required>

                <button type="submit">Enviar</button>
            </form>
        </section>
        <section>
            <img src="../assets/images/QuimiBurgersShop.png"
                alt="Local de QuimiBurgers en Ameguino 357, centro de San Nicolas de los Arroyos" height="400vh"
                width="auto" alt="Exterior de Quimiburgers con clientes comiendo hamburguesas frente al local">
        </section>

    </main>
    <footer>
        <p>&copy; 2026 QuimiBurgers. Todos los derechos reservados.</p>
        <figure>
            <img src="../assets/icons/whatsapp.svg" alt="Número de Whatsapp de Quimiburgers" height="30vh" width="auto">
            <p>Whatsapp: 4234-5678</p>
        </figure>
        <figure>
            <img src="../assets/icons/instagram.svg" alt="Número de Instagram de Quimiburgers" height="30vh"
                width="auto">
            <p>Instagram: @quimiburgers</p>
        </figure>
    </footer>
</body>

</html>
